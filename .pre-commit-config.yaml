repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --locked --all-extras mypy
        language: system
        types: [python]
        args: [--config-file=pyproject.toml, src]
        pass_filenames: false
