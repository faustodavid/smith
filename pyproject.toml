[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smith"
version = "0.1.3"
description = "Read-only Azure DevOps and GitHub investigation CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Smith OSS Contributors" }
]
dependencies = [
  "requests>=2.34.2,<3",
  "azure-identity>=1.25.3,<2",
  "truststore>=0.10.4,<0.11",
  "pyyaml>=6.0.3,<7",
  "toon-format==0.9.0b1",
  "keyring>=25.7.0,<26",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.16.0,<8",
  "mcp>=2.1.1,<3",
  "mypy==2.3.1",
  "openai-agents>=0.22.0,<0.23",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff==0.16.5",
  "types-requests==2.33.0.20260712",
]
bench = [
  "aiohttp>=3.14.3,<4",
  "httpx>=0.28.1,<0.29",
  "mcp>=2.1.1,<3",
  "openai-agents>=0.22.0,<0.23",
  "pytest-asyncio>=1.4.0,<2",
]

[project.scripts]
smith = "smith.cli.main:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
show_error_codes = true
plugins = []
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["azure.*", "yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true
